# Build the three BAKED Simulacra firmwares in CI, merge each to a single flashable image, and deploy
# the web-flasher (web/ + the freshly-built firmware/) to GitHub Pages -- so binaries never live in git.
#
# SETUP (one-time, when you publish): repo Settings -> Pages -> Source = "GitHub Actions". Repo public.
#
# HONEST CAVEATS (this is a sketch; expect first-run tuning):
#   * ESP32-C5 is new -- the espressif/idf:v5.5 image must have c5 support (it should in 5.5; verify).
#   * esp-idf-ci-action builds inside the espressif/idf docker; managed_components are fetched at build
#     (CI has network). If a component pin fails, tweak main/idf_component.yml.
#   * Each of the 3 builds takes a few minutes. matrix fail-fast is off so one break doesn't hide others.
name: web-flasher

on:
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    paths:                      # rebuild only when firmware or the page changes
      - 'main/**'
      - 'cyd/**'
      - 'components/**'
      - 'web/index.html'
      - 'web/manifest.json'
      - 'web/*.js'
      - '.github/workflows/flasher.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                    # never race two Pages deploys
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: decoy-c5   # -> firmware/decoy-c5.bin (Ward)
            idf: v5.5
            target: esp32c5
            path: .
          - name: decoy-c6   # -> firmware/decoy-c6.bin (Shade)
            idf: v5.4
            target: esp32c6
            path: .
          - name: cyd        # -> firmware/cyd.bin (Vigil controller; separate project in cyd/)
            idf: v5.4
            target: esp32
            path: cyd
    steps:
      - uses: actions/checkout@v5

      # Seed a control-key PLACEHOLDER for the CYD build.
      #
      # This is not the key anybody ends up running. The browser generates a real keypair at flash
      # time and rewrites these bytes in the downloaded image (web/keygen.js + web/keypatch.js), so
      # what CI compiles in is a stand-in that exists only to give the patcher a block to find and
      # to satisfy the build. SIMULACRA_CTRL_SK is also used to derive the SD-card encryption keys
      # for the learned library and the signature DB, so the header has to be present regardless.
      - name: Seed the control-key placeholder (rewritten in the browser at flash time)
        if: matrix.path == 'cyd'
        run: cp cyd/main/sim_ctrl_sk.h.example cyd/main/sim_ctrl_sk.h

      # PROVISIONED REGIME, WITH THE KEYS GENERATED IN THE BROWSER.
      #
      # The rule that drives all of this: anything compiled into a published binary is public. These
      # images are downloadable from the Pages site, so a signing secret baked into one is secret
      # only until somebody runs grep. Verified 2026-09-14 against a local build -- the control
      # secret sat at a fixed offset in the CYD image. Regenerating the keypair per CI run does not
      # help, because the new secret ships in the new download.
      #
      # Between 2026-09-14 and 2026-09-15 the answer here was to compile NO control plane at all,
      # which removed the forgeable command path but left the mesh encrypted under a published
      # transport key. That is encryption anybody can undo, so it was only half an answer.
      #
      # What actually fixes it: build the PROVISIONED regime, and make the one key it rests on
      # per-install. The browser generates an Ed25519 keypair, rewrites it into the images before
      # flashing, and everything downstream becomes per-install for free -- the Vigil mints a random
      # ESP-NOW transport key on first boot (fleet_db.c) and hands it to decoys over the
      # authenticated enrollment, so that key never exists in any binary either.
      #
      # THE KEY BLOCKS ARE LOAD-BEARING. Both builds must carry the magic-prefixed blocks from
      # sim_ctrl_key.h / sim_ctrl_sk.h, or the flasher has nothing to patch and refuses the image
      # rather than flashing a published key. Do not "simplify" those headers back into bare arrays.
      - name: Build provisioned + merge
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: >-
            idf.py -B build_ci -DSIMULACRA_ESPNOW=1 -DSIMULACRA_CONFIG_CTRL=1
            -DSIMULACRA_FLEET_PROVISION=1 build &&
            cd build_ci &&
            esptool.py --chip ${{ matrix.target }} merge_bin -o ../${{ matrix.name }}.bin @flash_args

      - name: Collect merged image
        run: |
          mkdir -p out
          mv ${{ matrix.path }}/${{ matrix.name }}.bin out/${{ matrix.name }}.bin
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.name }}
          path: out/${{ matrix.name }}.bin
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The page is ES modules, so every .js has to ship or the key step 404s and the flasher
      # silently loses the thing that makes it safe. Copy the whole set explicitly rather than
      # listing files one by one, so adding a module does not need an edit here.
      - name: Assemble the site (page + modules + manifest + firmware)
        run: |
          mkdir -p _site/firmware
          cp web/index.html web/manifest.json web/*.js _site/
          ls -l _site

      - uses: actions/download-artifact@v8
        with:
          path: dl

      - name: Place the three merged bins (manifest uses relative firmware/ paths)
        run: |
          cp dl/fw-decoy-c5/decoy-c5.bin _site/firmware/decoy-c5.bin
          cp dl/fw-decoy-c6/decoy-c6.bin _site/firmware/decoy-c6.bin
          cp dl/fw-cyd/cyd.bin           _site/firmware/cyd.bin
          ls -l _site/firmware

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
