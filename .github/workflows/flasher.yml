# Build the three BAKED Simulacra firmwares in CI, merge each to a single flashable image, and deploy
# the web-flasher (web/ + the freshly-built firmware/) to GitHub Pages -- so binaries never live in git.
#
# SETUP (one-time, when you publish): repo Settings -> Pages -> Source = "GitHub Actions". Repo public.
#
# HONEST CAVEATS (this is a sketch; expect first-run tuning):
#   * ESP32-C5 is new -- the espressif/idf:v5.5 image must have c5 support (it should in 5.5; verify).
#   * esp-idf-ci-action builds inside the espressif/idf docker; managed_components are fetched at build
#     (CI has network). If a component pin fails, tweak main/idf_component.yml.
#   * Each of the 3 builds takes a few minutes. matrix fail-fast is off so one break doesn't hide others.
name: web-flasher

on:
  workflow_dispatch:            # manual "Run workflow" button

  # Validate the console demo on the PR that changes it. Only the webdemo job runs here -- the
  # firmware matrix and the Pages deploy stay on main. Without this the wasm build's first ever
  # execution would be a push to production, which is the one place it must not break.
  pull_request:
    paths:
      - 'web/vigil.html'
      - 'tools/radar_audit/vigil_web.c'
      - 'tools/radar_audit/sim_fleet.c'
      - 'tools/radar_audit/sim_fleet.h'
      - 'tools/radar_audit/build_web.sh'
      - '.github/workflows/flasher.yml'

  push:
    branches: [main]
    paths:                      # rebuild only when firmware or the page changes
      - 'main/**'
      - 'cyd/**'
      - 'components/**'
      - 'web/index.html'
      - 'web/manifest.json'
      - 'web/*.js'
      - 'web/vigil.html'
      - 'tools/radar_audit/vigil_web.c'
      - 'tools/radar_audit/sim_fleet.c'
      - 'tools/radar_audit/sim_fleet.h'
      - 'tools/radar_audit/build_web.sh'
      - '.github/workflows/flasher.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                    # never race two Pages deploys
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: decoy-c5   # -> firmware/decoy-c5.bin (Ward)
            idf: v5.5
            target: esp32c5
            path: .
            magic: SIMULACRA:CTRLPK
          - name: decoy-c6   # -> firmware/decoy-c6.bin (Shade)
            idf: v5.4
            target: esp32c6
            path: .
            magic: SIMULACRA:CTRLPK
          - name: cyd        # -> firmware/cyd.bin (Vigil controller; separate project in cyd/)
            idf: v5.4
            target: esp32
            path: cyd
            magic: SIMULACRA:CTRLSK
    steps:
      - uses: actions/checkout@v5

      # Seed a control-key PLACEHOLDER for the CYD build.
      #
      # This is not the key anybody ends up running. The browser generates a real keypair at flash
      # time and rewrites these bytes in the downloaded image (web/keygen.js + web/keypatch.js), so
      # what CI compiles in is a stand-in that exists only to give the patcher a block to find and
      # to satisfy the build. SIMULACRA_CTRL_SK is also used to derive the SD-card encryption keys
      # for the learned library and the signature DB, so the header has to be present regardless.
      - name: Seed the control-key placeholder (rewritten in the browser at flash time)
        if: matrix.path == 'cyd'
        run: cp cyd/main/sim_ctrl_sk.h.example cyd/main/sim_ctrl_sk.h

      # PROVISIONED REGIME, WITH THE KEYS GENERATED IN THE BROWSER.
      #
      # The rule that drives all of this: anything compiled into a published binary is public. These
      # images are downloadable from the Pages site, so a signing secret baked into one is secret
      # only until somebody runs grep. Verified 2026-09-14 against a local build -- the control
      # secret sat at a fixed offset in the CYD image. Regenerating the keypair per CI run does not
      # help, because the new secret ships in the new download.
      #
      # Between 2026-09-14 and 2026-09-15 the answer here was to compile NO control plane at all,
      # which removed the forgeable command path but left the mesh encrypted under a published
      # transport key. That is encryption anybody can undo, so it was only half an answer.
      #
      # What actually fixes it: build the PROVISIONED regime, and make the one key it rests on
      # per-install. The browser generates an Ed25519 keypair, rewrites it into the images before
      # flashing, and everything downstream becomes per-install for free -- the Vigil mints a random
      # ESP-NOW transport key on first boot (fleet_db.c) and hands it to decoys over the
      # authenticated enrollment, so that key never exists in any binary either.
      #
      # THE KEY BLOCKS ARE LOAD-BEARING. Both builds must carry the magic-prefixed blocks from
      # sim_ctrl_key.h / sim_ctrl_sk.h, or the flasher has nothing to patch and refuses the image
      # rather than flashing a published key. Do not "simplify" those headers back into bare arrays.
      - name: Build provisioned + merge
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: >-
            idf.py -B build_ci -DSIMULACRA_ESPNOW=1 -DSIMULACRA_CONFIG_CTRL=1
            -DSIMULACRA_FLEET_PROVISION=1 build &&
            cd build_ci &&
            esptool.py --chip ${{ matrix.target }} merge_bin -o ../${{ matrix.name }}.bin @flash_args

      - name: Collect merged image
        run: |
          mkdir -p out
          mv ${{ matrix.path }}/${{ matrix.name }}.bin out/${{ matrix.name }}.bin
          ls -l out

      # The whole point of these images is that the browser can rewrite their key block before
      # flashing. If the block is missing the image still builds, still boots, and still looks fine
      # here -- and then web/keypatch.js throws for every visitor, on every board, because flash.js
      # patches all three builds before it knows which chip you have.
      #
      # That is exactly what shipped: CI builds the Vigil from cyd/main/sim_ctrl_sk.h.example (it
      # cannot use the gitignored real header), and that template was left in the pre-magic format
      # when browser keying landed. It compiled, so nothing noticed. See issue #10.
      - name: Verify the browser-patchable key block survived into the image
        run: |
          python3 - <<'EOF'
          import sys
          magic = b"${{ matrix.magic }}"
          blob  = open("out/${{ matrix.name }}.bin", "rb").read()
          n = blob.count(magic)
          print(f"${{ matrix.name }}.bin: {len(blob)} bytes, {magic.decode()} x{n}")
          # More than one is normal and fine: the key lives in a `static const` in a header, so
          # every translation unit that includes it gets a copy (the Vigil image carries two --
          # cyd_main.c and fleet_db.c). keypatch.js writes the key into EVERY occurrence it finds
          # and returns the count, so duplicates stay consistent. Zero is the failure.
          if n < 1:
              sys.exit(f"::error::${{ matrix.name }}.bin contains no {magic.decode()} block. "
                       f"The web flasher cannot personalise this image, which breaks flashing "
                       f"for everyone, on every board. See issue #10.")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.name }}
          path: out/${{ matrix.name }}.bin
          if-no-files-found: error

  webdemo:
    # web/vigil.html -- the Vigil console compiled to WebAssembly, so the page can be tried without
    # buying a board. Runs in emscripten's own image rather than adding a third-party action to this
    # workflow's trust surface. The tag floats; if a toolchain change ever breaks the build, the
    # blast radius is this job only (see below), so pinning can wait until it actually bites.
    #
    # THIS JOB MUST NEVER BLOCK THE DEPLOY. `deploy` waits for it but does not require success, so a
    # broken demo cannot take down the page people use to flash real hardware. That page is the
    # product; this is a nice-to-have sitting next to it.
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v5

      # build_web.sh owns the source list; build_web.ps1 is its Windows twin. Keep them in sync.
      - name: Build the console demo
        run: sh tools/radar_audit/build_web.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vigil-web
          path: |
            web/vigil_web.js
            web/vigil_web.wasm
          if-no-files-found: error

  deploy:
    # Waits for webdemo, but only *requires* build. If the demo failed, the flasher still ships.
    needs: [build, webdemo]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The page is ES modules, so every .js has to ship or the key step 404s and the flasher
      # silently loses the thing that makes it safe. Copy the whole set explicitly rather than
      # listing files one by one, so adding a module does not need an edit here.
      - name: Assemble the site (page + modules + manifest + firmware)
        run: |
          mkdir -p _site/firmware
          cp web/index.html web/vigil.html web/manifest.json web/*.js _site/
          ls -l _site

      - uses: actions/download-artifact@v8
        with:
          path: dl

      - name: Place the three merged bins (manifest uses relative firmware/ paths)
        run: |
          cp dl/fw-decoy-c5/decoy-c5.bin _site/firmware/decoy-c5.bin
          cp dl/fw-decoy-c6/decoy-c6.bin _site/firmware/decoy-c6.bin
          cp dl/fw-cyd/cyd.bin           _site/firmware/cyd.bin
          ls -l _site/firmware

      # vigil.html always ships; its wasm may not. The page reports the failure in-place rather
      # than showing a blank screen, so a missing demo degrades instead of looking broken.
      - name: Add the console demo, if it built
        run: |
          if [ -f dl/vigil-web/vigil_web.wasm ]; then
            cp dl/vigil-web/vigil_web.js dl/vigil-web/vigil_web.wasm _site/
            echo "console demo included"
          else
            echo "::warning::console demo did not build this run; deploying the flasher without it"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
