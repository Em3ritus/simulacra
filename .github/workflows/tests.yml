# Host test suites. Until this existed, nothing ran the ~190 tests in tools/ on push: the probe_audit
# POSIX build had been broken by a missing source for weeks, and a decoy_audit test had gone
# seed-dependent -- both invisible because the only workflow built firmware and deployed Pages.
name: host-tests

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the host harnesses
        run: |
          for d in probe_audit decoy_audit pcap_learn radar_audit; do
            echo "::group::$d"
            make -C tools/$d
            echo "::endgroup::"
          done

      - name: Run the suites
        # `-s tools -t .` cannot recurse into tools/*/tests/ -- none of tools/, tools/<dir>/, or
        # tools/<dir>/tests/ are Python packages (no __init__.py, deliberately -- these are
        # standalone host-test harnesses, not an installable package), and unittest's discover only
        # descends into directories it can import as packages. That made this step silently discover
        # and run ZERO of the ~190 tests below on every push since this workflow was created (see git
        # history for the incident). Enumerate each tool's own tests/ dir directly instead --
        # exactly the pattern each tool's own run.ps1 already uses for local runs.
        run: |
          for d in decoy_audit probe_audit pcap_learn radar_audit; do
            echo "::group::tools/$d"
            python -m unittest discover -s tools/$d/tests -p 'test_*.py' -v
            echo "::endgroup::"
          done
          echo "::group::tools/tests"
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
          echo "::endgroup::"

      - name: Run the web manifest tests
        run: python -m unittest discover -s web -p 'test_*.py'

  # The on-target self-test never runs in CI (it needs hardware), but it must keep COMPILING as the
  # APIs it asserts against move -- otherwise it silently rots and stops being flashable when needed.
  selftest-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build CHURN_SELFTEST=1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32c6
          path: .
          command: idf.py -B build_st -DCHURN_SELFTEST=1 -DSIMULACRA_ESPNOW=1 -DSIMULACRA_CONFIG_CTRL=1 build
